[project]
name = "payment-processing-service"
version = "0.1.0"
description = "Микросервис асинхронного процессинга платежей"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.12",
    "faststream[rabbit,cli]>=0.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "structlog>=25.1.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "mypy>=1.19.0",
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.3.0",
    "pytest-env>=1.2.0",
    "pytest-httpx>=0.36.0",
    "pytest-mock>=3.17.0",
    "pytest-randomly>=4.0.1",
    "ruff>=0.11.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = 'py313'
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "B",       # flake8-bugbear
    "TID",     # flake8-tidy-imports
    "Q",       # flake8-quotes
    "SIM",     # flake8-simplify
    "ICN",     # flake8-import-conventions
    "ISC",     # flake8-implicit-str-concat
    "TC",      # flake8-type-checking
    "UP",      # pyupgrade
    "I",       # isort
    "C90",     # mccabe
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "RSE",     # flake8-raise
    "PGH",     # pygrep-hooks
    "D201", "D204", "D206", "D207", "D208", "D209", "D210", "D211", "D213", "D300", "D301", "D402", "D412", "D414",  # правила для докстрингов
    "G004",    # logging-f-string
    "PT",      # flake8-pytest-style
]
ignore = [
    "ISC001",  # конфликтует с ruff format
    "Q000", "Q003",  # кавычки контролирует ruff format
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-import-conventions.aliases]
typing = "t"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Path", "faststream.Depends"]

[tool.pytest.ini_options]
env = [
    "ENVIRONMENT=Pytest",
    "DB_NAME=payments_test",
    "API_KEY=test-api-key",
    # отдельные имена, чтобы тесты не конфликтовали с топологией запущенного docker compose
    "RABBITMQ_PAYMENTS_EXCHANGE=test.payments",
    "QUEUE_PAYMENTS_NEW=test.payments.new",
    "PAYMENT_MAX_ATTEMPTS=3",
    "PAYMENT_RETRY_BASE_DELAY=0.1",
    "GATEWAY_MIN_DELAY=0",
    "GATEWAY_MAX_DELAY=0",
    "GATEWAY_SUCCESS_RATE=1",
    "OUTBOX_POLL_INTERVAL=0.05",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src"]
# SQLAlchemy asyncio работает через greenlet: без этого coverage теряет строки после await
concurrency = ["greenlet", "thread"]
omit = ["src/migrations/*"]

[tool.coverage.report]
exclude_also = [
    "if t.TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.13"
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_decorators = false
exclude = ["^tests/", "^conftest\\.py$", "^src/migrations/versions/"]
plugins = ["pydantic.mypy"]
