repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff linter
        entry: uv run ruff check --fix --show-fixes
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types_or: [python, pyi]
